# panraid — conda/mamba environment
#
# v0.1 - September 11th 20:00
#
# Create:
#   mamba env create -f panraid-environment.yml
# Update in place:
#   mamba env update -f panraid-environment.yml --prune
#
# conda-forge only — no "defaults"/Anaconda main channel is used
# ("nodefaults" below suppresses any channel pulled in from a user's
# global .condarc, and channel_priority strict is recommended in your
# .condarc / mambarc when using this file).

name: panraid

channels:
  - conda-forge
  - nodefaults

dependencies:
  # loose/floor pin — let the solver pick the newest Python that's
  # mutually compatible with every package below (currently caps out
  # at 3.13, since that's the newest pytorch-gpu is built for)
  - python>=3.11

  # GPU toolkit - if you can install this on your system
  # - cuda-toolkit

  # McStas / McXtrace ray-tracing suites (conda-forge carries 3.8.4)
  - mcstas>=3.8.4
  - mcxtrace>=3.8.4

  # 3D visualization widget (Jupyter)
  - pythreejs

  # scientific Python / ML stack
  # (renamed from the Debian/Fedora-style "python3-*" apt/rpm package
  # names you listed to their actual conda-forge package names — see
  # note below)
  - joblib
  - numpy
  - scipy
  - scikit-learn
  - scikit-image
  - pytorch-tabnet
  - pytorch
  # - pytorch-gpu
  - xgboost          #   (auto-selects CUDA-enabled build
                            #  when cuda-toolkit is present)
